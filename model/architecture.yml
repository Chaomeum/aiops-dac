architecture:
  id: ey_aiops_ci_cd_diagnosis
  name: Prototipo AIOps para diagnóstico de fallos CI/CD
  model_version: "0.3.0-physical-views"
  phase: "phase_3_physical_views"
  status: draft
  renderable: true

  view_constraints:
    max_nodes_per_view: 15

governance:
  technology_override:
    source: tech_drift_resolutions.md
    rule: >
      Toda decisión tecnológica del Trabajo de Investigación que contradiga
      tech_drift_resolutions.md se considera obsoleta para la arquitectura TO-BE.

  scope_authority:
    source: "P202620027 - Project Charter v.1.3.docx"
    rule: >
      Ningún elemento, integración o capacidad fuera del alcance del Project Charter
      podrá promoverse al modelo canónico.

  academic_rationale:
    source: TI_Galvez_Jhon_Guzman_Ramiro.docx
    rule: >
      El Trabajo de Investigación sustenta las decisiones conceptuales,
      arquitectónicas y científicas, pero su stack físico histórico no se considera
      vigente salvo ratificación posterior.

sources:
  - id: SRC_TI
    file: TI_Galvez_Jhon_Guzman_Ramiro.docx
    role: academic_and_architectural_rationale

  - id: SRC_CHARTER
    file: "P202620027 - Project Charter v.1.3.docx"
    role: scope_boundary

  - id: SRC_DRIFT
    file: tech_drift_resolutions.md
    role: technology_override

  - id: SRC_ADR_001
    file: docs/architecture/decisions/ADR-001-azure-container-apps.md
    role: approved_architectural_decision

  - id: SRC_ADR_002
    file: docs/architecture/decisions/ADR-002-azure-observability.md
    role: approved_architectural_decision

  - id: SRC_ADR_003
    file: docs/architecture/decisions/ADR-003-identity-api-perimeter.md
    role: approved_architectural_decision

  - id: SRC_ADR_004
    file: docs/architecture/decisions/ADR-004-azure-openai.md
    role: approved_architectural_decision

  - id: SRC_ADR_005
    file: docs/architecture/decisions/ADR-005-github-app-authentication.md
    role: approved_architectural_decision

  - id: SRC_ADR_006
    file: docs/architecture/decisions/ADR-006-dashboard-api-contract.md
    role: approved_architectural_decision

  - id: SRC_ADR_007
    file: docs/architecture/decisions/ADR-007-log-processing-and-embeddings.md
    role: approved_architectural_decision

  - id: SRC_ADR_008
    file: docs/architecture/decisions/ADR-008-react-azure-static-web-apps.md
    role: approved_architectural_decision

  - id: SRC_ADR_009
    file: docs/architecture/decisions/ADR-009-remove-reporting-service.md
    role: approved_architectural_decision

  - id: SRC_ADR_010
    file: docs/architecture/decisions/ADR-010-remove-anomaly-detector-from-mvp.md
    role: approved_architectural_decision

  - id: SRC_ADR_011
    file: docs/architecture/decisions/ADR-011-audit-trail-without-audit-service.md
    role: approved_architectural_decision

  - id: SRC_ADR_012
    file: docs/architecture/decisions/ADR-012-remove-notification-channels-from-mvp.md
    role: approved_architectural_decision

  - id: SRC_ADR_013
    file: docs/architecture/decisions/ADR-013-retention-365-days.md
    role: approved_architectural_decision

  - id: SRC_ADR_014
    file: docs/architecture/decisions/ADR-014-devsecops-scanners-outside-mvp.md
    role: approved_architectural_decision

  - id: SRC_ADR_015
    file: docs/architecture/decisions/ADR-015-diagnostic-runtime-boundaries-and-orchestration.md
    role: approved_architectural_decision

  - id: SRC_ADR_016
    file: docs/architecture/decisions/ADR-016-identity-api-human-review-and-artifact-flow.md
    role: approved_architectural_decision

layers:
  - id: L1
    name: Presentación y Consumo Operativo
    purpose: >
      Exponer incidentes, diagnósticos, evidencias, recomendaciones,
      métricas y revisión humana.
    status: confirmed
    source:
      - SRC_TI#Arquitectura-Logica
      - SRC_CHARTER#Alcance-del-Proyecto

  - id: L2
    name: Acceso, Seguridad y Gobierno
    purpose: >
      Aplicar control de acceso, mínimo privilegio, auditoría,
      trazabilidad y controles de privacidad.
    status: confirmed
    source:
      - SRC_TI#Arquitectura-Logica
      - SRC_CHARTER#Suposiciones-y-Restricciones
      - SRC_DRIFT#Modelo-de-acceso-a-GitHub

  - id: L3
    name: Ingesta y Normalización
    purpose: >
      Capturar evidencia autorizada, validar, limpiar, normalizar,
      minimizar y proteger información antes del análisis.
    status: confirmed
    source:
      - SRC_TI#Arquitectura-Logica
      - SRC_CHARTER#Alcance-del-Proyecto
      - SRC_DRIFT#Captura-e-ingesta

  - id: L4
    name: Procesamiento Orientado a Eventos
    purpose: >
      Desacoplar la ingesta del procesamiento mediante mensajería
      persistente y asíncrona.
    status: confirmed
    source:
      - SRC_TI#Arquitectura-Logica
      - SRC_DRIFT#Broker-de-eventos
      - SRC_DRIFT#Patron-de-mensajeria

  - id: L5
    name: Procesamiento y Correlación AIOps
    purpose: >
      Procesar semánticamente registros y correlacionar evidencia
      operacional de fallos identificados por GitHub Actions.
    status: confirmed
    source:
      - SRC_TI#Arquitectura-Logica
      - SRC_CHARTER#Objetivos-Especificos
      - SRC_DRIFT#Procesamiento-inicial-de-logs
      - SRC_DRIFT#Correlacion-de-evidencia

  - id: L6
    name: Inteligencia Asistida y Diagnóstico
    purpose: >
      Recuperar conocimiento contextual y generar hipótesis
      diagnósticas asistidas mediante un LLM preentrenado.
    status: confirmed
    source:
      - SRC_TI#Arquitectura-Logica
      - SRC_CHARTER#Resumen-ejecutivo
      - SRC_DRIFT#Modelo-de-lenguaje

  - id: L7
    name: Persistencia y Evidencia
    purpose: >
      Conservar incidentes, diagnósticos, revisiones, auditoría,
      conocimiento recuperable y evidencias.
    status: confirmed
    source:
      - SRC_TI#Arquitectura-Logica
      - SRC_CHARTER#Recursos-de-Datos-y-Evidencias
      - SRC_DRIFT#Persistencia-estructurada

  - id: L8
    name: Integraciones Externas
    purpose: >
      Representar las herramientas CI/CD, DevSecOps y observabilidad
      que producen o consumen evidencia operacional.
    status: confirmed
    source:
      - SRC_TI#Arquitectura-Integrada
      - SRC_CHARTER#Alcance-del-Proyecto
      - SRC_DRIFT#Repositorio-y-plataforma-CI-CD-principal

elements:
  - id: technical_users
    name: Usuarios Técnicos
    kind: actor
    layer: L1
    roles:
      - developers
      - devops_sre
      - qa
      - technical_leads
      - information_security
    status: confirmed
    source:
      - SRC_CHARTER#Stakeholders-Beneficiarios-o-Usuarios
      - SRC_DRIFT#Actores-de-validacion

  - id: github
    name: GitHub
    kind: external_system
    layer: L8
    responsibility: source_control
    authentication:
      mechanism: GitHub App
      access: read_only
      credential_type: installation_token
    status: confirmed
    source:
      - SRC_DRIFT#Repositorio-y-plataforma-CI-CD-principal
      - SRC_ADR_005

  - id: github_actions
    name: GitHub Actions
    kind: external_system
    layer: L8
    responsibility: ci_cd_execution_and_evidence_source
    indirect_scanner_evidence:
      via:
        - workflow_logs
        - workflow_events
        - workflow_artifacts
      evidence_types:
        - quality_gate_results
        - dependency_findings
        - security_findings
        - configuration_findings
    diagnostic_artifact:
      source: diagnostic_output
      publication: native_workflow_step
      format: implementation_detail
    status: confirmed
    source:
      - SRC_CHARTER#Alcance-del-Proyecto
      - SRC_DRIFT#Repositorio-y-plataforma-CI-CD-principal
      - SRC_ADR_009
      - SRC_ADR_014

  - id: observability_sources
    name: Fuentes de Observabilidad y Runtime Compatibles
    kind: external_system
    layer: L8
    evidence_types:
      - container_events
      - deployment_events
      - runtime_events
      - metrics_when_available
      - traces_when_available
    technology:
      decision_status: closed
      name: Azure Monitor
      application_telemetry: Application Insights
    status: confirmed
    source:
      - "tech_drift_resolutions.md#Observabilidad"
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A20:I21"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B23:C23"
      - SRC_ADR_002

  - id: entra_id
    name: Microsoft Entra ID
    kind: external_system
    layer: L2
    responsibility: corporate_identity_provider
    technology:
      decision_status: closed
      name: Microsoft Entra ID
    capabilities:
    - corporate_authentication
    - identity_token_issuance
    status: confirmed
    source:
    - SRC_ADR_003
    - SRC_ADR_016

  - id: api_management
    name: Azure API Management
    kind: container
    layer: L2
    responsibility: api_perimeter_and_routing
    capabilities:
    - protected_api_entry_point
    - request_routing
    - access_policy_enforcement
    technology:
      decision_status: closed
      name: Azure API Management
    host:
      environment: microsoft_azure
      concrete_service: Azure API Management
    status: confirmed
    source:
    - SRC_ADR_003
    - SRC_ADR_016

  - id: ingestion_normalization_service
    name: Servicio de Ingesta y Normalización
    kind: container
    layer: L3
    capabilities:
      - authorized_capture
      - canonical_event_mapping
      - validation
      - parsing
      - cleaning
      - normalization
      - operational_noise_filtering
      - masking
      - anonymization
      - secret_filtering
      - data_minimization
      - correlation_id_assignment
      - evidence_metadata_capture
    canonical_event_context:
      - pipeline
      - execution
      - commit
      - service
      - environment
      - correlationId
    source_specialization:
      initial_source: github_actions
      extensible_contracts: true
    host:
      environment: microsoft_azure
      runtime: controlled_container_environment
      concrete_service: Azure Container Apps
    status: confirmed
    source:
      - "TP202620027 - Product Backlog v.1.0.xlsx#Backlog_Detallado!A5:K17"
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A6:I33"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B21:C26"
      - SRC_ADR_001

  - id: azure_service_bus
    name: Azure Service Bus
    kind: container
    layer: L4
    responsibility: persistent_asynchronous_messaging
    technology:
      decision_status: closed
      name: Azure Service Bus
    topology:
      decision_status: closed
      kind: topic_with_subscriptions
      topic_count: 1
      subscriptions:
        - consumer: pipeline_service
        - consumer: log_event_service
        - consumer: nlp_log_processor
    status: confirmed
    source:
      - SRC_DRIFT#Broker-de-eventos
      - SRC_DRIFT#Patron-de-mensajeria

  - id: nlp_log_processor
    name: Procesamiento NLP de Logs
    kind: container
    layer: L5
    capabilities:
    - semantic_representation
    - log_preprocessing
    - signal_preparation
    parser:
      decision_status: closed
      selected: Drain3
    embedding_model:
      decision_status: closed
      provider: Azure OpenAI Service
      capability: embeddings
      selected_model: null
      purpose: semantic_retrieval_for_rag
    status: confirmed
    source:
    - SRC_DRIFT#Procesamiento-inicial-de-logs
    - SRC_DRIFT#Procesamiento-NLP
    - SRC_ADR_007
    - SRC_ADR_015
    host:
      environment: microsoft_azure
      runtime: controlled_container_environment
      concrete_service: Azure Container Apps

  - id: pipeline_service
    name: Pipeline Service
    kind: container
    layer: L5
    responsibilities:
      - register_pipeline
      - register_execution
      - maintain_pipeline_stages
      - maintain_execution_state
      - maintain_execution_metadata
    traceability_keys:
      - pipeline
      - execution
      - commit
      - correlationId
    host:
      environment: microsoft_azure
      runtime: controlled_container_environment
      concrete_service: Azure Container Apps
    status: confirmed
    source:
      - "TP202620027 - Product Backlog v.1.0.xlsx#Backlog_Detallado!A19:K19"
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A34:I35"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B28:C28"

  - id: log_event_service
    name: Log/Event Service
    kind: container
    layer: L5
    responsibilities:
      - register_normalized_evidence
      - query_logs_by_incident
      - query_events_by_incident
      - query_evidence_by_correlation_id
      - preserve_source_metadata
      - resolve_external_evidence_references
    host:
      environment: microsoft_azure
      runtime: controlled_container_environment
      concrete_service: Azure Container Apps
    status: confirmed
    source:
      - "TP202620027 - Product Backlog v.1.0.xlsx#Backlog_Detallado!A20:K20"
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A36:I37"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B28:C28"

  - id: evidence_correlation_engine
    name: Servicio de Correlación de Evidencias
    kind: container
    layer: L5
    correlation_dimensions:
      - workflow
      - run
      - job
      - stage
      - service
      - commit
      - timestamp
      - errors
      - events
      - available_metrics
      - correlationId
    constraints:
      - do_not_merge_unrelated_executions
      - preserve_evidence_provenance
    host:
      environment: microsoft_azure
      runtime: controlled_container_environment
      concrete_service: Azure Container Apps
    status: confirmed
    source:
      - "TP202620027 - Product Backlog v.1.0.xlsx#Backlog_Detallado!A25:K25"
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A46:I47"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B32:C32"
      - SRC_ADR_001

  - id: recommendation_service
    name: Diagnostic & Recommendation Service
    kind: container
    layer: L6
    responsibilities:
    - generate_initial_recommendations
    - associate_recommendation_with_probable_cause
    - associate_recommendation_with_evidence
    - expose_evidence_limitations
    - orchestrate_diagnostic_flow
    diagnostic_output:
      type: structured_contract
      includes:
      - incident_id
      - execution_context
      - failure_summary
      - probable_cause
      - supporting_evidence
      - consulted_sources
      - recommendations
      - limitations
      - confidence
    autonomous_execution: false
    host:
      environment: microsoft_azure
      runtime: controlled_container_environment
      concrete_service: Azure Container Apps
    status: confirmed
    source:
    - TP202620027 - Product Backlog v.1.0.xlsx#Backlog_Detallado!A31:K31
    - TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A58:I59
    - TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B37:C37
    - SRC_ADR_001
    - SRC_ADR_009
    - SRC_ADR_015

  - id: human_review_component
    name: Human Review & Diagnostic Governance
    kind: component
    layer: L6
    parent: recommendation_service
    capabilities:
    - recommendation_risk_classification
    - critical_recommendation_marking
    - human_approval_enforcement
    - review_registration
    - validate_diagnosis
    - correct_diagnosis
    - reject_diagnosis
    status: confirmed
    source:
    - SRC_ADR_011
    - SRC_ADR_016

  - id: rag_retrieval
    name: Recuperación de Conocimiento RAG
    kind: container
    layer: L6
    knowledge_scope:
    - reviewed_incidents
    - authorized_technical_documentation
    - authorized_response_procedures
    provenance_required: true
    semantic_representation:
      provider: Azure OpenAI Service
      capability: embeddings
      vector_store: pgvector_knowledge_store
    status: confirmed
    source:
    - SRC_CHARTER#Marco-Teorico-RAG
    - SRC_DRIFT#Base-de-conocimiento-RAG
    - SRC_ADR_007
    - SRC_ADR_015
    host:
      environment: microsoft_azure
      runtime: controlled_container_environment
      concrete_service: Azure Container Apps
    responsibilities:
    - retrieve_authorized_knowledge
    - semantic_search
    - preserve_provenance
    - interact_with_vector_store

  - id: pretrained_llm_diagnostic_service
    name: Azure OpenAI Service
    kind: external_system
    layer: L6
    strategy: pretrained_model_integrated
    deployment_mode:
      decision_status: closed
      selected: service_api
    provider: Azure OpenAI Service
    model_family: GPT-4
    model: null
    input_contract:
    - sanitized_prioritized_evidence
    - correlated_context
    - rag_retrieved_knowledge
    output_contract:
    - probable_cause_hypothesis
    - supporting_evidence
    - consulted_sources
    - recommendation
    - limitations
    - confidence_when_applicable
    status: confirmed
    source:
    - SRC_CHARTER#Modelos-de-lenguaje-preentrenados
    - SRC_DRIFT#Modelo-de-lenguaje
    - SRC_DRIFT#Entrada-del-LLM
    - SRC_DRIFT#Resultado-automatico
    - SRC_ADR_004
    - SRC_ADR_015
    managed_service: true

  - id: postgresql_operational_store
    name: PostgreSQL
    kind: datastore
    layer: L7
    responsibilities:
      - pipelines
      - incidents
      - diagnoses
      - human_reviews
      - recommendations
      - metrics
      - audit_metadata
      - evidence_references
      - traceability_metadata
    persistence_strategy:
      domain_separation: true
      physical_database_split: false
    technology:
      decision_status: closed
      name: PostgreSQL
    status: confirmed
    source:
      - "TP202620027 - Product Backlog v.1.0.xlsx#Backlog_Detallado!A21:K21"
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A38:I39"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B29:C29"

  - id: pgvector_knowledge_store
    name: pgvector Knowledge Store
    kind: datastore
    layer: L7
    responsibility: semantic_retrieval
    parent_technology: PostgreSQL
    technology:
      decision_status: closed
      name: pgvector
    status: confirmed
    source:
      - SRC_DRIFT#Recuperacion-vectorial

  - id: object_evidence_store
    name: Almacenamiento de Evidencias y Artefactos
    kind: datastore
    layer: L7
    responsibilities:
      - large_logs
      - technical_evidence
      - pipeline_artifacts
      - diagnostic_reports
      - historical_logs_when_authorized
    reference_requirements:
      - incident_identifier
      - execution_identifier
      - correlationId
    technology:
      decision_status: closed
      name: Azure Blob Storage
    status: confirmed
    source:
      - "TP202620027 - Product Backlog v.1.0.xlsx#Backlog_Detallado!A22:K22"
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A40:I41"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B30:C30"

  - id: web_dashboard
    name: Dashboard Web AIOps
    kind: container
    layer: L1
    capabilities:
      - incident_query
      - diagnosis_query
      - evidence_query
      - recommendation_query
      - pipeline_status_query
      - tmd_metrics
      - comparative_diagnosis_metrics
      - human_review_registration
      - human_review_status_display
      - distinguish_generated_hypothesis_from_validated_diagnosis
      - role_protected_access
    backend_contract:
      entry_point: Azure API Management
      protocol: REST/HTTPS
      services:
        - pipeline_service
        - log_event_service
        - recommendation_service
    technology:
      decision_status: closed
      framework: React
      architecture_style: SPA
    host:
      cloud: Azure
      concrete_service: Azure Static Web Apps
    status: confirmed
    source:
      - "TP202620027 - Product Backlog v.1.0.xlsx#Backlog_Detallado!A35:K37"
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A66:I71"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B38:C38"
      - SRC_ADR_006
      - SRC_ADR_008

relationships:
  - id: rel_github_actions_ingestion_event
    from: github_actions
    to: ingestion_normalization_service
    label: Emite eventos autorizados del workflow
    protocol: HTTPS/Webhook
    style: event
    access: read_only
    status: confirmed
    source:
      - SRC_DRIFT#Integracion-con-la-plataforma-CI-CD

  # ----------------------------------------------------------
  # ADD — broker consumers introduced by domain services
  # ----------------------------------------------------------
  - id: rel_service_bus_pipeline_service
    from: azure_service_bus
    to: pipeline_service
    label: Entrega eventos de ejecución para registrar contexto del pipeline
    protocol: Azure Service Bus
    style: async
    status: confirmed
    source:
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A32:I35"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B27:C28"

  - id: rel_service_bus_log_event_service
    from: azure_service_bus
    to: log_event_service
    label: Entrega evidencia normalizada para registro y consulta
    protocol: Azure Service Bus
    style: async
    status: confirmed
    source:
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A32:I37"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B27:C28"


  # ----------------------------------------------------------
  # ADD — domain persistence
  # ----------------------------------------------------------
  - id: rel_pipeline_service_postgresql
    from: pipeline_service
    to: postgresql_operational_store
    label: Persiste pipelines, etapas, estados y metadatos de ejecución
    protocol: PostgreSQL
    style: sync
    status: confirmed
    source:
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A34:I39"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B28:C29"

  - id: rel_log_event_service_postgresql
    from: log_event_service
    to: postgresql_operational_store
    label: Persiste y consulta metadatos y referencias de evidencia normalizada
    protocol: PostgreSQL
    style: sync
    status: confirmed
    source:
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A36:I41"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B28:C30"

  - id: rel_log_event_service_object_store
    from: log_event_service
    to: object_evidence_store
    label: Almacena y resuelve referencias de logs extensos y evidencias
    protocol: Object Storage API
    style: sync
    status: confirmed
    source:
      - "TP202620027 - Historias de Usuario v.1.0.xlsx#HIstoria de Usuario!A36:I41"
      - "TP202620027 - Plan de trabajo v.1.0.xlsx#Plan de Trabajo!B30:C30"


  # ----------------------------------------------------------
  # ADD — recommendation flow
  # Persist diagnostic output and recommendations over PostgreSQL.
  # ----------------------------------------------------------
