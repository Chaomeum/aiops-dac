conflicts:
  resolved:
    - id: CF-001
      topic: source_precedence
      conflict: >
        tech_drift_resolutions.md declara internamente Project Charter
        v1.3 por encima del propio drift, mientras la directiva actual
        de ingesta establece al drift como override tecnológico absoluto.
      resolution: >
        Para esta ingesta prevalece la directiva actual del proyecto:
        tech_drift_resolutions.md actúa como override tecnológico.
      action_required: >
        Actualizar posteriormente la cabecera de tech_drift_resolutions.md
        para evitar ambigüedad para agentes futuros.

    - id: CF-002
      topic: ci_cd_platform
      obsolete: Azure DevOps / Jenkins / múltiples alternativas principales
      canonical: GitHub + GitHub Actions
      resolved_by: SRC_DRIFT

    - id: CF-003
      topic: ingestion_scope
      obsolete: Adaptadores equivalentes para múltiples plataformas
      canonical: GitHub Actions como integración inicial especializada
      resolved_by: SRC_DRIFT

    - id: CF-004
      topic: privacy_gateway
      obsolete: Privacy Gateway como microservicio independiente
      canonical: Responsabilidades integradas en ingesta/normalización
      resolved_by: SRC_DRIFT

    - id: CF-005
      topic: event_broker
      obsolete: Kafka / RabbitMQ / Azure Service Bus como alternativas
      canonical: Azure Service Bus
      resolved_by: SRC_DRIFT

    - id: CF-007
      topic: diagnosis_semantics
      obsolete: Causa raíz generada automáticamente
      canonical: Causa probable hasta validación técnica
      resolved_by: SRC_DRIFT

    - id: CF-008
      topic: autonomous_remediation
      obsolete: Self-healing semiautónomo como parte potencial del MVP
      canonical: Remediación autónoma fuera del MVP
      resolved_by: SRC_DRIFT

    - id: CF-009
      topic: primary_time_kpi
      obsolete: MTTR como indicador contractual principal
      canonical: TMD con reducción mínima del 30 por ciento
      resolved_by: SRC_DRIFT

    - id: CF-010
      topic: observability_products
      obsolete: Loki / Prometheus u otros productos como componentes obligatorios
      canonical: Azure Monitor como plataforma de observabilidad y Application Insights para telemetría de aplicación
      resolved_by:
        - SRC_DRIFT
        - SRC_ADR_002

  unresolved: []

