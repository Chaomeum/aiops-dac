cross_cutting_controls:
  - id: CTRL-001
    name: Read-only y mínimo privilegio
    applies_to:
      - github
      - github_actions

  - id: CTRL-002
    name: Privacy by Design
    rules:
      - masking_before_ai
      - anonymization_before_ai
      - minimization_before_ai
      - secret_filtering_before_ai

  - id: CTRL-003
    name: Trazabilidad end-to-end
    identifier: correlationId

  - id: CTRL-004
    name: Auditoría técnica
    required: true

  - id: CTRL-005
    name: Human-in-the-Loop
    required: true

  - id: CTRL-006
    name: Separación evaluación-RAG
    rule: >
      Los casos de evaluación y sus soluciones de referencia no pueden
      formar parte del conocimiento recuperable mediante RAG.

architectural_invariants:
  - id: INV-001
    rule: >
      Ninguna evidencia potencialmente sensible puede alcanzar NLP,
      detector AIOps, RAG o LLM sin pasar previamente por ingesta,
      normalización y protección de datos.

  - id: INV-002
    rule: >
      El LLM no recibe logs crudos directamente.

  - id: INV-003
    rule: >
      El acceso del prototipo a GitHub/GitHub Actions es read-only
      por defecto y debe operar bajo mínimo privilegio.

  - id: INV-004
    rule: >
      El Motor AIOps detecta y prioriza anomalías; no produce una
      causa raíz confirmada.

  - id: INV-005
    rule: >
      Toda salida automática se denomina causa probable hasta que
      sea validada mediante evidencia y revisión técnica.

  - id: INV-006
    rule: >
      La revisión humana debe poder validar, corregir o rechazar
      diagnóstico y recomendación.

  - id: INV-007
    rule: >
      La remediación autónoma queda fuera del MVP.

  - id: INV-008
    rule: >
      No se entrenan modelos desde cero, no se modifican pesos y
      el ajuste de hiperparámetros no constituye aporte de la tesis.

  - id: INV-009
    rule: >
      La duración de retención no puede codificarse hasta disponer
      de política institucional o normativa aplicable.

  - id: INV-010
    rule: >
      Los casos y soluciones utilizados para evaluación deben
      mantenerse separados del corpus utilizado por RAG.

