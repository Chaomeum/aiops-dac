# Presentación 16:9 de las dos vistas C4 de contenedores existentes.
# Membresía, fronteras y relaciones se contrastan con la proyección C4 canónica.
model_version: "1.0.0"
architecture_source: model/architecture.yml
canvas: {width: 1920, height: 1080}
projection: canonical_c4_container
# Agrupaciones que ya realiza C4, explicitadas para esta presentación.
collapse:
  human_review_component: recommendation_service
  pgvector_knowledge_store: postgresql_operational_store

