# Modelo de presentación; las decisiones y hechos se leen del SSOT referenciado.
# No describe implementación ni sustituye las vistas canónicas.
model_version: "1.0.0"
architecture_source: model/architecture.yml
purpose: Sustentación académica — síntesis de la arquitectura lógica
show_protocols: false

# Agrupación exclusivamente visual de componentes en su contenedor existente.
# Las relaciones internas desaparecen al agrupar; las salientes conservan origen.
collapse:
  human_review_component: recommendation_service
  diagnostic_api_component: recommendation_service
  diagnostic_orchestrator_component: recommendation_service
  diagnostic_output_component: recommendation_service

# Etiquetas editoriales breves. Acción completa y protocolo: tooltip del SVG.
relationship_labels:
  rel_github_github_actions: "Repository and workflows"
  rel_github_actions_ingestion_event: "Workflow events"
  rel_ingestion_github_actions_read: "Queries logs and artifacts"
  rel_observability_sources_ingestion: "Authorized telemetry"
  rel_ingestion_service_bus: "Protected evidence"
  rel_service_bus_pipeline_service: "Execution context"
  rel_service_bus_log_event_service: "Normalized evidence"
  rel_service_bus_nlp: "Normalized events"
  rel_nlp_correlation: "Processed evidence"
  rel_correlation_recommendation: "Correlated context"
  rel_recommendation_rag: "Requests knowledge"
  rel_rag_pgvector: "Semantic search"
  rel_recommendation_llm: "Inference with evidence and RAG"
  rel_technical_users_dashboard: "Querying and human review"
  rel_dashboard_entra: "Corporate authentication"
  rel_dashboard_apim: "Protected APIs"
  rel_apim_pipeline_service: "Queries executions"
  rel_apim_log_event_service: "Queries evidence"
  rel_apim_recommendation_service: "Diagnosis and review"
  rel_pipeline_service_postgresql: "Pipeline context"
  rel_log_event_service_postgresql: "Evidence references"
  rel_log_event_service_object_store: "Large logs and evidence"
  rel_recommendation_service_postgresql: "Diagnosis and recommendations"
  rel_human_review_postgresql: "Review decisions"
  rel_github_actions_apim_diagnostic: "Queries diagnosis for artifact"
  rel_correlation_postgresql: "Context and traceability"

views:
  - id: logica_expo_01
    kind: logical_presentation
    title: "Logical View 01 — Evidence Intake and Distribution"
    status: draft
    final: false
    include_external: true
    elements:
      - github
      - github_actions
      - observability_sources
      - ingestion_normalization_service
      - azure_service_bus
      - pipeline_service
      - log_event_service
    groups:
      - id: sources
        title: "External sources"
        elements: [github, github_actions, observability_sources]
      - id: intake
        title: "Ingestion and messaging"
        elements: [ingestion_normalization_service, azure_service_bus]
      - id: registration
        title: "Operational registration"
        elements: [pipeline_service, log_event_service]
    continuation: "Service Bus also delivers events to NLP (view 02). Persistence and queries: view 03."
    narration: >
      GitHub Actions origina eventos de ejecuciones fallidas. Ingesta consulta
      evidencia autorizada, la normaliza y protege antes de publicarla en Service
      Bus. Pipeline Service, Log/Event Service y NLP consumen suscripciones
      independientes; NLP continúa en la segunda vista.

  - id: logica_expo_02
    kind: logical_presentation
    title: "Logical View 02 — Assisted Diagnosis"
    status: draft
    final: false
    include_external: true
    elements:
      - azure_service_bus
      - nlp_log_processor
      - evidence_correlation_engine
      - recommendation_service
      - rag_retrieval
      - pgvector_knowledge_store
      - pretrained_llm_diagnostic_service
    groups:
      - id: preparation
        title: "Evidence preparation"
        elements: [azure_service_bus, nlp_log_processor, evidence_correlation_engine]
      - id: diagnosis
        title: "Diagnostic orchestration"
        elements: [recommendation_service]
      - id: knowledge
        title: "Knowledge retrieval"
        elements: [rag_retrieval, pgvector_knowledge_store]
      - id: inference
        title: "External inference"
        elements: [pretrained_llm_diagnostic_service]
    continuation: "Input from view 01. Diagnosis persistence, querying and human review: view 03."
    narration: >
      NLP entrega evidencia procesada a correlación. Diagnostic & Recommendation
      Service recibe el contexto del incidente, recupera conocimiento autorizado
      mediante RAG y solicita inferencia a Azure OpenAI. La respuesta es una causa
      probable con evidencia y recomendaciones; no ejecuta remediación autónoma.

  - id: logica_expo_03
    kind: logical_presentation
    title: "Logical View 03 — Consumption and Human Review"
    status: draft
    final: false
    include_external: true
    elements:
      - technical_users
      - web_dashboard
      - entra_id
      - github_actions
      - api_management
      - pipeline_service
      - log_event_service
      - recommendation_service
      - postgresql_operational_store
      - object_evidence_store
    groups:
      - id: interaction
        title: "Interaction and identity"
        elements: [technical_users, web_dashboard, entra_id]
      - id: perimeter
        title: "API access"
        elements: [github_actions, api_management]
      - id: services
        title: "Prototype services"
        elements: [pipeline_service, log_event_service, recommendation_service]
      - id: persistence
        title: "Persistence and evidence"
        elements: [postgresql_operational_store, object_evidence_store]
    continuation: "Services from views 01/02 reappear as the same elements. Actions publishes its own artifact."
    narration: >
      Los usuarios se autentican con Entra ID y consumen el dashboard mediante
      APIs protegidas por APIM. Los servicios consultan y conservan contexto,
      evidencia, diagnósticos y revisión humana. GitHub Actions recupera el
      diagnóstico mediante APIM y publica el artifact con un paso nativo.
