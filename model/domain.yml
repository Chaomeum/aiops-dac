assumptions:
- id: A-001
  status: assumption
  description_es: UUID asignados por cada servicio; no default ni extensión generadora de UUID.
  source:
  - model/domain_decisions.md
- id: A-002
  status: assumption
  description_es: Tiempos en timestamptz; created_at asignado por el owner. diagnosis_ready_at pertenece
    a cada versión; no se duplica en ops.incidents ni se almacena TMD.
  source:
  - model/domain_decisions.md
- id: A-003
  status: assumption
  description_es: IDs externos GitHub como text, run_attempt positivo; claves únicas por repositorio/workflow
    y pipeline/run/attempt.
  source:
  - model/domain_decisions.md
- id: A-004
  status: assumption
  description_es: failed representa el fallo ya identificado por GitHub Actions; no fija un algoritmo
    nuevo de detección ni una taxonomía interna de resultados.
  source:
  - model/domain_decisions.md
- id: A-005
  status: assumption
  description_es: Severity nullable mientras no exista regla aprobada de derivación; no derivar de criticality
    ni de log level.
  source:
  - model/domain_decisions.md
- id: A-006
  status: assumption
  description_es: correlated_contexts conserva evidence_ids UUID[] como referencias lógicas al owner log_event_service;
    validación y saneamiento en aplicación, sin tabla de asociación adicional.
  source:
  - model/domain_decisions.md
- id: A-007
  status: assumption
  description_es: probable_cause nullable para snapshots ANALYZING/INCONCLUSIVE; DIAGNOSIS_READY exige
    causa probable y diagnosis_ready_at. Cambiar estado añade una versión inmutable.
  source:
  - model/domain_decisions.md
- id: A-008
  status: assumption
  description_es: confidence JSONB nullable conserva el valor recibido sin fijar escala, unidad ni representación
    numérica obligatoria.
  source:
  - model/domain_decisions.md
- id: A-009
  status: assumption
  description_es: chunk_index empieza en cero y es único por documento; embedding nullable durante carga,
    sin resolver mecanismo de actualización.
  source:
  - model/domain_decisions.md
- id: A-010
  status: assumption
  description_es: El corpus elegible y las referencias lógicas son verificados por los owners en aplicación;
    constraints estructurales no pueden detectar texto de evaluación ni datos sensibles dentro de texto/JSON.
  source:
  - model/domain_decisions.md
- id: A-011
  status: assumption
  description_es: No hay originales Charter/TI/drift en el checkout; las referencias a alcance provienen
    del modelo canónico vigente y del prompt aprobado, sin atribuir nuevos requisitos literales al Charter.
  source:
  - model/domain_decisions.md
- id: A-012
  status: assumption
  description_es: 'Sin cardinalidad final adicional para revisiones: se admite historial de human_reviews
    por versión; la ausencia implica PENDING y no se agrega enum persistido de validación.'
  source:
  - model/domain_decisions.md
