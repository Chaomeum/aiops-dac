# Proyección física para exposición. Hechos y tecnologías proceden del SSOT.
# Las agrupaciones de lectura no declaran redes, recursos o hosts adicionales.
model_version: "1.0.0"
architecture_source: model/architecture.yml
purpose: Sustentación académica — síntesis de la arquitectura física
show_protocols: false

# Componentes internos representados en el contenedor existente, sin nuevos hosts.
collapse:
  human_review_component: recommendation_service
  diagnostic_api_component: recommendation_service
  diagnostic_orchestrator_component: recommendation_service
  diagnostic_output_component: recommendation_service

relationship_labels:
  rel_github_github_actions: Repositorio y workflows
  rel_github_actions_ingestion_event: Eventos del workflow
  rel_ingestion_github_actions_read: Consulta logs y artefactos
  rel_observability_sources_ingestion: Telemetría autorizada
  rel_ingestion_service_bus: Evidencia protegida
  rel_service_bus_pipeline_service: Contexto de ejecución
  rel_service_bus_log_event_service: Evidencia normalizada
  rel_service_bus_nlp: Eventos normalizados
  rel_nlp_correlation: Evidencia procesada
  rel_correlation_recommendation: Contexto correlacionado
  rel_recommendation_rag: Solicita conocimiento
  rel_rag_pgvector: Búsqueda semántica
  rel_recommendation_llm: Inferencia con evidencia y RAG
  rel_technical_users_dashboard: Consulta y revisión humana
  rel_dashboard_entra: Autenticación corporativa
  rel_dashboard_apim: APIs protegidas
  rel_apim_pipeline_service: Consulta ejecuciones
  rel_apim_log_event_service: Consulta evidencias
  rel_apim_recommendation_service: Diagnóstico y revisión
  rel_pipeline_service_postgresql: Contexto del pipeline
  rel_log_event_service_postgresql: Referencias de evidencia
  rel_log_event_service_object_store: Logs y evidencias extensas
  rel_recommendation_service_postgresql: Diagnóstico y recomendaciones
  rel_human_review_postgresql: Decisiones de revisión
  rel_github_actions_apim_diagnostic: Consulta diagnóstico para artifact
  rel_correlation_postgresql: Contexto y trazabilidad

views:
  - id: fisica_expo_01
    kind: physical_presentation
    title: "Física 01 — Fuentes, ingesta y mensajería"
    status: draft
    final: false
    include_external: true
    elements:
      - github
      - github_actions
      - observability_sources
      - ingestion_normalization_service
      - azure_service_bus
      - pipeline_service
      - log_event_service
    groups:
      - id: sources
        title: Fuentes externas
        elements: [github, github_actions, observability_sources]
      - id: intake
        title: Ingesta y mensajería
        elements: [ingestion_normalization_service, azure_service_bus]
      - id: registration
        title: Consumidores operacionales
        elements: [pipeline_service, log_event_service]
    continuation: "Service Bus entrega también eventos a NLP (vista 02). Persistencia y acceso: vista 03."
    narration: >
      GitHub Actions y Azure Monitor aportan evidencia autorizada. Ingesta,
      cuyo diseño especifica Java y Spring Boot sobre Azure Container Apps,
      protege y normaliza los datos antes de Service Bus. Un topic distribuye
      los eventos a tres suscripciones: Pipeline Service, Log/Event Service y NLP;
      este último continúa en la segunda vista. El acceso a GitHub es read-only.

  - id: fisica_expo_02
    kind: physical_presentation
    title: "Física 02 — Runtime del diagnóstico asistido"
    status: draft
    final: false
    include_external: true
    elements:
      - azure_service_bus
      - nlp_log_processor
      - evidence_correlation_engine
      - recommendation_service
      - rag_retrieval
      - pgvector_knowledge_store
      - pretrained_llm_diagnostic_service
    groups:
      - id: preparation
        title: Mensajería y procesamiento
        elements: [azure_service_bus, nlp_log_processor, evidence_correlation_engine]
      - id: diagnosis
        title: Orquestación del diagnóstico
        elements: [recommendation_service]
      - id: knowledge
        title: RAG y conocimiento vectorial
        elements: [rag_retrieval, pgvector_knowledge_store]
      - id: inference
        title: Servicio externo gestionado
        elements: [pretrained_llm_diagnostic_service]
    continuation: "Entrada desde vista 01. PostgreSQL/pgvector: misma instancia física. Consumo y revisión: vista 03."
    narration: >
      NLP y RAG usan Python y FastAPI; correlación y diagnóstico usan Java y Spring
      Boot. Los cuatro servicios tienen runtime propio en Azure Container Apps.
      NLP utiliza Drain3. Diagnóstico orquesta RAG, que consulta pgvector sobre
      PostgreSQL, y solicita inferencia a Azure OpenAI, familia GPT-4 sin modelo
      concreto fijado. Azure OpenAI es externo y no se aloja en Container Apps.

  - id: fisica_expo_03
    kind: physical_presentation
    title: "Física 03 — Acceso, persistencia y revisión humana"
    status: draft
    final: false
    include_external: true
    elements:
      - technical_users
      - web_dashboard
      - entra_id
      - github_actions
      - api_management
      - pipeline_service
      - log_event_service
      - recommendation_service
      - postgresql_operational_store
      - object_evidence_store
    groups:
      - id: interaction
        title: Presentación e identidad
        elements: [technical_users, web_dashboard, entra_id]
      - id: perimeter
        title: Acceso a las APIs
        elements: [github_actions, api_management]
      - id: services
        title: Servicios de aplicación
        elements: [pipeline_service, log_event_service, recommendation_service]
      - id: persistence
        title: Persistencia
        elements: [postgresql_operational_store, object_evidence_store]
    continuation: "Actions recupera el diagnóstico por APIM y publica su artifact. Revisión humana dentro del servicio diagnóstico."
    narration: >
      El dashboard React y TypeScript se aloja en Azure Static Web Apps. Entra ID
      autentica y APIM protege y enruta las APIs; ninguno se despliega en Container
      Apps. Los servicios mantienen datos estructurados en PostgreSQL y evidencias
      extensas en Azure Blob Storage. La revisión humana se registra dentro del
      servicio diagnóstico. El workflow publica el artifact con su paso nativo.
