# Proyección física para exposición. Hechos y tecnologías proceden del SSOT.
# Las agrupaciones de lectura no declaran redes, recursos o hosts adicionales.
model_version: "1.0.0"
architecture_source: model/architecture.yml
purpose: Sustentación académica — síntesis de la arquitectura física
show_protocols: false

# Componentes internos representados en el contenedor existente, sin nuevos hosts.
collapse:
  human_review_component: recommendation_service
  diagnostic_api_component: recommendation_service
  diagnostic_orchestrator_component: recommendation_service
  diagnostic_output_component: recommendation_service

relationship_labels:
  rel_github_github_actions: "Repository and workflows"
  rel_github_actions_ingestion_event: "Workflow events"
  rel_ingestion_github_actions_read: "Queries logs and artifacts"
  rel_observability_sources_ingestion: "Authorized telemetry"
  rel_ingestion_service_bus: "Protected evidence"
  rel_service_bus_pipeline_service: "Execution context"
  rel_service_bus_log_event_service: "Normalized evidence"
  rel_service_bus_nlp: "Normalized events"
  rel_nlp_correlation: "Processed evidence"
  rel_correlation_recommendation: "Correlated context"
  rel_recommendation_rag: "Requests knowledge"
  rel_rag_pgvector: "Semantic search"
  rel_recommendation_llm: "Inference with evidence and RAG"
  rel_technical_users_dashboard: "Querying and human review"
  rel_dashboard_entra: "Corporate authentication"
  rel_dashboard_apim: "Protected APIs"
  rel_apim_pipeline_service: "Queries executions"
  rel_apim_log_event_service: "Queries evidence"
  rel_apim_recommendation_service: "Diagnosis and review"
  rel_pipeline_service_postgresql: "Pipeline context"
  rel_log_event_service_postgresql: "Evidence references"
  rel_log_event_service_object_store: "Large logs and evidence"
  rel_recommendation_service_postgresql: "Diagnosis and recommendations"
  rel_human_review_postgresql: "Review decisions"
  rel_github_actions_apim_diagnostic: "Queries diagnosis for artifact"
  rel_correlation_postgresql: "Context and traceability"

views:
  - id: fisica_expo_01
    kind: physical_presentation
    title: "Physical View 01 — Sources, Ingestion and Messaging"
    status: draft
    final: false
    include_external: true
    elements:
      - github
      - github_actions
      - observability_sources
      - ingestion_normalization_service
      - azure_service_bus
      - pipeline_service
      - log_event_service
    groups:
      - id: sources
        title: "External sources"
        elements: [github, github_actions, observability_sources]
      - id: intake
        title: "Ingestion and messaging"
        elements: [ingestion_normalization_service, azure_service_bus]
      - id: registration
        title: "Operational consumers"
        elements: [pipeline_service, log_event_service]
    continuation: "Service Bus also delivers events to NLP (view 02). Persistence and access: view 03."
    narration: >
      GitHub Actions y Azure Monitor aportan evidencia autorizada. Ingesta,
      cuyo diseño especifica Java y Spring Boot sobre Azure Container Apps,
      protege y normaliza los datos antes de Service Bus. Un topic distribuye
      los eventos a tres suscripciones: Pipeline Service, Log/Event Service y NLP;
      este último continúa en la segunda vista. El acceso a GitHub es read-only.

  - id: fisica_expo_02
    kind: physical_presentation
    title: "Physical View 02 — Assisted Diagnosis Runtime"
    status: draft
    final: false
    include_external: true
    elements:
      - azure_service_bus
      - nlp_log_processor
      - evidence_correlation_engine
      - recommendation_service
      - rag_retrieval
      - pgvector_knowledge_store
      - pretrained_llm_diagnostic_service
    groups:
      - id: preparation
        title: "Messaging and processing"
        elements: [azure_service_bus, nlp_log_processor, evidence_correlation_engine]
      - id: diagnosis
        title: "Diagnostic orchestration"
        elements: [recommendation_service]
      - id: knowledge
        title: "RAG and vector knowledge"
        elements: [rag_retrieval, pgvector_knowledge_store]
      - id: inference
        title: "External managed service"
        elements: [pretrained_llm_diagnostic_service]
    continuation: "Input from view 01. PostgreSQL/pgvector: the same physical instance. Consumption and review: view 03."
    narration: >
      NLP y RAG usan Python y FastAPI; correlación y diagnóstico usan Java y Spring
      Boot. Los cuatro servicios tienen runtime propio en Azure Container Apps.
      NLP utiliza Drain3. Diagnóstico orquesta RAG, que consulta pgvector sobre
      PostgreSQL, y solicita inferencia a Azure OpenAI, familia GPT-4 sin modelo
      concreto fijado. Azure OpenAI es externo y no se aloja en Container Apps.

  - id: fisica_expo_03
    kind: physical_presentation
    title: "Physical View 03 — Access, Persistence and Human Review"
    status: draft
    final: false
    include_external: true
    elements:
      - technical_users
      - web_dashboard
      - entra_id
      - github_actions
      - api_management
      - pipeline_service
      - log_event_service
      - recommendation_service
      - postgresql_operational_store
      - object_evidence_store
    groups:
      - id: interaction
        title: "Presentation and identity"
        elements: [technical_users, web_dashboard, entra_id]
      - id: perimeter
        title: "API access"
        elements: [github_actions, api_management]
      - id: services
        title: "Application services"
        elements: [pipeline_service, log_event_service, recommendation_service]
      - id: persistence
        title: "Persistence"
        elements: [postgresql_operational_store, object_evidence_store]
    continuation: "Actions retrieves the diagnosis through APIM and publishes its artifact. Human review is within the diagnostic service."
    narration: >
      El dashboard React y TypeScript se aloja en Azure Static Web Apps. Entra ID
      autentica y APIM protege y enruta las APIs; ninguno se despliega en Container
      Apps. Los servicios mantienen datos estructurados en PostgreSQL y evidencias
      extensas en Azure Blob Storage. La revisión humana se registra dentro del
      servicio diagnóstico. El workflow publica el artifact con su paso nativo.
