# SSOT exclusivo del diseño de clases; no describe código implementado.
model_version: 1.0.0
design_rules:
  container: recommendation_service
  language: Java
  framework: Spring Boot
  max_nodes_per_diagram: 15
  cqrs: logical
  persistence: postgresql_operational_store
  event_sourcing: false
  separate_read_write_databases: false
  autonomous_remediation: false
  github_access: read_only
  artifact_publisher: github_actions
  navigation_views: [c4_context, c4_container_processing, c4_component_diagnostic]
  source: [model/architecture.yml, model/domain.yml, SRC_ADR_018]

# Las clases compartidas se definen una sola vez. elements es la membresía exacta.
class_diagrams:
  - id: CD-1
    title: CD-1 — Diagnostic API y CQRS
    zoom_target: diagnostic_api_component
    elements:
      - DiagnosisCommandController
      - DiagnosisQueryController
      - GenerateDiagnosisCommand
      - GenerateDiagnosisCommandService
      - GenerateDiagnosisCommandServiceImpl
      - GetDiagnosisQuery
      - DiagnosisQueryService
      - DiagnosisQueryServiceImpl
      - DiagnosticView
      - DiagnosticOrchestrator
      - DiagnosisRepository
      - HumanReviewCommandController
      - HumanReviewQueryController
      - HumanReviewCommandService
      - HumanReviewQueryService
    notes:
      - Commands devuelven identificadores; queries componen proyecciones sin escritura.
      - Contexto correlacionado recibido por REST/HTTPS; URI no especificada por la arquitectura.
      - Operaciones de revisión y consulta ya derivadas de IA/ADR; sin endpoints adicionales.
      - Orquestador y repositorio se detallan en CD-2; revisión humana se detalla en CD-3.
  - id: CD-2
    title: CD-2 — Orquestación de Diagnóstico, RAG y LLM
    zoom_target: diagnostic_orchestrator_component
    elements:
      - DiagnosticOrchestrator
      - KnowledgeRetrievalPort
      - RagRetrievalHttpAdapter
      - DiagnosticLlmGateway
      - AzureOpenAiDiagnosticAdapter
      - LlmResponseTranslator
      - SanitizedDiagnosticContext
      - DiagnosticOutputComposer
      - Diagnosis
      - Recommendation
      - ProbableCause
      - DiagnosisRepository
      - JpaDiagnosisRepositoryAdapter
      - RagRetrievalExternal
      - AzureOpenAiExternal
    notes:
      - DiagnosticOutputComposer realiza diagnostic_output_component dentro de esta figura.
      - Solo evidencia saneada, contexto autorizado y conocimiento RAG alcanzan el gateway.
      - Cada snapshot diagnóstico es inmutable; DIAGNOSIS_READY exige causa probable y fecha.
      - Recomendaciones y vínculos se insertan con el snapshot; IDs lógicos entre contextos.
  - id: CD-3
    title: CD-3 — Human Review y Gobierno Diagnóstico
    zoom_target: human_review_component
    elements:
      - HumanReviewCommandController
      - HumanReviewQueryController
      - RecordHumanReviewCommand
      - HumanReviewCommandService
      - HumanReviewCommandServiceImpl
      - HumanReviewQueryService
      - HumanReviewQueryServiceImpl
      - HumanReview
      - HumanReviewDecision
      - RiskClassificationService
      - HumanReviewRepository
      - JpaHumanReviewRepositoryAdapter
      - AuditTrailPort
      - PostgresAuditTrailAdapter
    notes:
      - CONFIRMED valida; CORRECTED exige actualCause; REJECTED rechaza sin alternativa validada.
      - PENDING se deriva por ausencia de revisión; no se persiste en HumanReview.
      - Clasificación de riesgo y marcado crítico requieren política aprobada; sin umbrales inventados.
      - Auditoría transversal hacia audit.audit_events con metadata saneada e IDs de correlación.

