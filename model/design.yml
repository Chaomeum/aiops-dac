assumptions:
  - id: DA-001
    description: Las firmas de controller abrevian el contrato REST; no fijan rutas nuevas ni DTO externos. Los servicios reciben los commands/queries explícitos y el controller solo adapta y delega.
  - id: DA-002
    description: Los repositorios tienen métodos de escritura y lectura sobre la misma persistencia. Las queries solo usan métodos read y componen proyecciones en aplicación; no se crean SQL views.
  - id: DA-003
    description: UUID e Instant representan uuid y timestamptz. Object representa el valor de confidence sin imponer escala ni usar un tipo JSON de proveedor en el dominio. ProbableCause envuelve text.
  - id: DA-004
    description: Las relaciones de composición representan membresía del aggregate; los atributos persisted_as son exclusivamente las columnas existentes. El adaptador persiste los vínculos por IDs, sin nuevas clases de tablas auxiliares.
  - id: DA-005
    description: SanitizedDiagnosticContext usa colecciones y mapas internos con semántica del input_contract vigente; el adaptador RAG traduce su respuesta a estas estructuras. El orquestador completa el contexto RAG antes de invocar infer.
  - id: DA-006
    description: Los proxies External son referencias gráficas con namespaces external.*, no clases Java implementables ni internals de los servicios remotos.
open_questions:
  - id: DQ-002
    source: model/domain.yml#open_questions
    description: Semántica y escala de confidence permanecen abiertas; se conserva el valor recibido.
  - id: DCQ-001
    source: model/architecture.yml#human_review_component
    description: La política concreta de clasificación de riesgo no está especificada; se representa su contrato sin algoritmo, categorías ni umbrales.
  - id: DCQ-002
    source: model/architecture.yml#rel_correlation_diagnostic_api
    description: La arquitectura declara recepción REST/HTTPS de contexto correlacionado, pero no su URI ni el DTO final. No se define un endpoint adicional.
  - id: DCQ-003
    source: model/architecture.yml#recommendation_service.diagnostic_output
    description: La fuente concreta para rehidratar executionContext y failureSummary en la proyección de consulta no está especificada. Se conserva el contrato existente sin elegir almacenamiento adicional, joins entre contextos ni nuevas comunicaciones.
